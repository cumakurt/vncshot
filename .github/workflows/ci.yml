name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; no token write access is required.
permissions:
  contents: read

# A newer push to the same ref makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint install.sh
        shell: bash
        run: |
          set -euo pipefail
          # SC2034 (unused variable) is excluded only for the two pre-existing
          # informational findings in install.sh (C_MAGENTA and ASSUME_YES).
          # They are tracked separately and must not be fixed here.
          shellcheck -S warning -e SC2034 install.sh
